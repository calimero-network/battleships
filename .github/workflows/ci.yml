name: CI

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "logic/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [master]
    paths:
      - "app/**"
      - "logic/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Frontend — Lint, Typecheck, Build
  # ============================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Lint
        run: pnpm --dir app lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm --dir app exec tsc --noEmit

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm --dir app build

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm --dir app test

  # ============================================================
  # Job 2: Logic — Rust Format, Clippy, WASM Build
  # ============================================================
  logic:
    name: Logic (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: logic-${{ runner.os }}-${{ hashFiles('logic/Cargo.toml') }}
          restore-keys: logic-${{ runner.os }}-

      - name: Cargo format
        working-directory: logic
        run: cargo fmt --check

      - name: Cargo clippy
        if: ${{ !cancelled() }}
        working-directory: logic
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build WASM
        if: ${{ !cancelled() }}
        working-directory: logic
        run: cargo build --target wasm32-unknown-unknown --profile app-release

  # ============================================================
  # Job 3: E2E — Merobox Battleships Workflow
  # ============================================================
  e2e:
    name: E2E (Merobox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install merobox (apt)
        run: |
          # Install from the official apt repo (https://calimero-network.github.io/merobox).
          # This is a signed binary release that bundles calimero-client-py internally,
          # so we don't have to coordinate pip versions for the two packages.
          # Mirrors mero-drive's CI setup.
          curl -fsSL https://calimero-network.github.io/merobox/gpg.key \
            | sudo tee /usr/share/keyrings/merobox.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/merobox.gpg] https://calimero-network.github.io/merobox stable main" \
            | sudo tee /etc/apt/sources.list.d/merobox.list
          sudo apt-get update
          sudo apt-get install -y merobox
          merobox --version

      - name: Run Battleships E2E Workflow
        id: run_e2e
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docker-logs"
          cd e2e
          max_attempts=2
          attempt=1
          success=false

          # Stream container logs to disk live so they survive merobox's
          # graceful-shutdown cleanup on failure (which removes the containers
          # before any post-run `docker logs` call can read them).
          start_log_streamer() {
            local n=$1
            ( docker events --filter type=container --filter event=start \
                --format '{{.Actor.Attributes.name}}' \
              | while read -r cname; do
                  case "$cname" in calimero-node-*)
                    docker logs -f "$cname" \
                      > "$GITHUB_WORKSPACE/docker-logs/e2e-attempt${n}-${cname}.log" 2>&1 &
                  ;; esac
                done ) &
            echo $! > "$GITHUB_WORKSPACE/docker-logs/.streamer-pid-${n}"
          }
          stop_log_streamer() {
            local n=$1
            local pidfile="$GITHUB_WORKSPACE/docker-logs/.streamer-pid-${n}"
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
              rm -f "$pidfile"
            fi
            # Give any in-flight `docker logs -f` children a beat to flush.
            sleep 1
            pkill -f "docker logs -f calimero-node-" 2>/dev/null || true
          }

          while [ $attempt -le $max_attempts ]; do
              if [ $attempt -gt 1 ]; then
                  echo "Retry attempt $attempt..."
                  merobox stop --all || true
                  merobox nuke --force || true
                  sleep 2
              fi

              start_log_streamer "$attempt"

              if merobox bootstrap run \
                  "workflow-battleships-e2e.yml" \
                  --e2e-mode; then
                  stop_log_streamer "$attempt"
                  success=true
                  break
              else
                  stop_log_streamer "$attempt"
                  attempt=$((attempt + 1))
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          if [ "$success" = false ]; then
              echo "failed=true" >> $GITHUB_OUTPUT
              exit 1
          fi

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-docker-logs-${{ github.sha }}
          path: docker-logs/
          retention-days: 7
          if-no-files-found: ignore
